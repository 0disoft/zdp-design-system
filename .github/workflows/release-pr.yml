name: Prepare release pull request

on:
  push:
    branches:
      - main
    paths:
      - ".changes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.repository }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == '0disoft/zdp-design-system' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
      version: ${{ steps.prepare.outputs.version }}
      bump: ${{ steps.prepare.outputs.bump }}
      fragment_count: ${{ steps.prepare.outputs.fragment_count }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate release preparation logic
        run: |
          bun scripts/release-changes.ts self-test
          bun scripts/release-changes.ts check

      - name: Prepare release files
        id: prepare
        run: |
          bun scripts/release-changes.ts prepare \
            --github-output "$GITHUB_OUTPUT" \
            --release-notes "$RUNNER_TEMP/release-notes.md"

      - name: Build release PR artifact
        if: steps.prepare.outputs.has_changes == 'true'
        run: |
          artifact_dir="$RUNNER_TEMP/release-pr-artifact"
          mkdir -p "$artifact_dir"
          cp package.json CHANGELOG.md "$artifact_dir/"
          cp "$RUNNER_TEMP/release-notes.md" "$artifact_dir/release-notes.md"
          git diff --name-only --diff-filter=D -- .changes > "$artifact_dir/consumed-fragments.txt"

          if [ ! -s "$artifact_dir/consumed-fragments.txt" ]; then
            echo "::error::Release preparation did not consume any fragment."
            exit 1
          fi

          RELEASE_ARTIFACT_DIR="$artifact_dir" node --input-type=commonjs <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = process.env.RELEASE_ARTIFACT_DIR;
          const files = ['package.json', 'CHANGELOG.md', 'release-notes.md', 'consumed-fragments.txt'];
          const manifest = {
            schemaVersion: 'zdp.release-pr-artifact/v1',
            sourceSha: process.env.GITHUB_SHA,
            files: Object.fromEntries(
              files.map((file) => [
                file,
                crypto.createHash('sha256').update(fs.readFileSync(path.join(directory, file))).digest('hex')
              ])
            )
          };
          fs.writeFileSync(path.join(directory, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload release PR artifact
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-pr-artifact
          path: ${{ runner.temp }}/release-pr-artifact
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Remove stale generated release state
        if: needs.prepare.outputs.has_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/zdp-design-system
        run: |
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "No release fragments remain on main; closing the stale generated release pull request."
          fi

          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" \
            >/dev/null 2>&1 || true

      - name: Check out source commit
        if: needs.prepare.outputs.has_changes == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun runtime
        if: needs.prepare.outputs.has_changes == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Download prepared release inputs
        if: needs.prepare.outputs.has_changes == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-pr-artifact
          path: ${{ runner.temp }}/release-pr-artifact

      - name: Verify transferred release PR artifact
        if: needs.prepare.outputs.has_changes == 'true'
        run: |
          artifact_dir="$RUNNER_TEMP/release-pr-artifact"
          RELEASE_ARTIFACT_DIR="$artifact_dir" node --input-type=commonjs <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = process.env.RELEASE_ARTIFACT_DIR;
          const expectedFiles = ['package.json', 'CHANGELOG.md', 'release-notes.md', 'consumed-fragments.txt'];
          const expectedArchiveFiles = [...expectedFiles, 'manifest.json'].sort();
          const entries = fs.readdirSync(directory, { withFileTypes: true });
          const actualArchiveFiles = entries.map((entry) => entry.name).sort();

          if (entries.some((entry) => !entry.isFile())) {
            throw new Error('Release PR artifact must contain regular files only.');
          }
          if (JSON.stringify(actualArchiveFiles) !== JSON.stringify(expectedArchiveFiles)) {
            throw new Error('Release PR artifact contains an unexpected archive file set.');
          }

          const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'manifest.json'), 'utf8'));
          if (manifest.schemaVersion !== 'zdp.release-pr-artifact/v1' || manifest.sourceSha !== process.env.GITHUB_SHA) {
            throw new Error('Release PR artifact does not match the triggering main commit.');
          }
          if (
            typeof manifest.files !== 'object' ||
            manifest.files === null ||
            Array.isArray(manifest.files) ||
            JSON.stringify(Object.keys(manifest.files).sort()) !== JSON.stringify([...expectedFiles].sort())
          ) {
            throw new Error('Release PR artifact manifest contains an unexpected file set.');
          }

          for (const file of expectedFiles) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(directory, file))).digest('hex');
            if (actual !== manifest.files[file]) {
              throw new Error(`Release PR artifact integrity mismatch for ${file}.`);
            }
          }

          const consumed = fs
            .readFileSync(path.join(directory, 'consumed-fragments.txt'), 'utf8')
            .split('\n')
            .filter((file) => file.length > 0);
          const uniqueConsumed = new Set(consumed);
          if (
            consumed.length === 0 ||
            uniqueConsumed.size !== consumed.length ||
            consumed.some((file) => !/^\.changes\/[a-z0-9]+(?:-[a-z0-9]+)*\.md$/.test(file))
          ) {
            throw new Error('Release PR artifact contains an invalid consumed fragment path.');
          }
          NODE

      - name: Reproduce and compare release preparation
        if: needs.prepare.outputs.has_changes == 'true'
        env:
          EXPECTED_BUMP: ${{ needs.prepare.outputs.bump }}
          EXPECTED_FRAGMENT_COUNT: ${{ needs.prepare.outputs.fragment_count }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          reproduced_output="$RUNNER_TEMP/reproduced-output"
          reproduced_notes="$RUNNER_TEMP/reproduced-release-notes.md"
          reproduced_fragments="$RUNNER_TEMP/reproduced-consumed-fragments.txt"
          artifact_dir="$RUNNER_TEMP/release-pr-artifact"

          bun scripts/release-changes.ts self-test
          bun scripts/release-changes.ts check
          bun scripts/release-changes.ts prepare \
            --github-output "$reproduced_output" \
            --release-notes "$reproduced_notes"
          git diff --name-only --diff-filter=D -- .changes > "$reproduced_fragments"

          grep -Fx 'has_changes=true' "$reproduced_output"
          grep -Fx "version=$EXPECTED_VERSION" "$reproduced_output"
          grep -Fx "bump=$EXPECTED_BUMP" "$reproduced_output"
          grep -Fx "fragment_count=$EXPECTED_FRAGMENT_COUNT" "$reproduced_output"
          cmp package.json "$artifact_dir/package.json"
          cmp CHANGELOG.md "$artifact_dir/CHANGELOG.md"
          cmp "$reproduced_notes" "$artifact_dir/release-notes.md"
          cmp "$reproduced_fragments" "$artifact_dir/consumed-fragments.txt"

      - name: Commit generated release files
        if: needs.prepare.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/zdp-design-system
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH"
          git add package.json CHANGELOG.md .changes

          if git diff --cached --quiet; then
            echo "::error::Release preparation reported changes but produced no staged diff."
            exit 1
          fi

          git commit -m "🔧 chore(release): prepare $RELEASE_VERSION"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Open or refresh release pull request
        if: needs.prepare.outputs.has_changes == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/zdp-design-system
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUMP: ${{ needs.prepare.outputs.bump }}
          RELEASE_FRAGMENT_COUNT: ${{ needs.prepare.outputs.fragment_count }}
        run: |
          body_file="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "## Summary"
            echo
            echo "Prepare zdp-design-system $RELEASE_VERSION from $RELEASE_FRAGMENT_COUNT merged release fragment(s). The highest requested bump is \`$RELEASE_BUMP\`."
            echo
            echo "## Included changes"
            echo
            cat "$RUNNER_TEMP/reproduced-release-notes.md"
            echo
            echo "## Release boundary"
            echo
            echo "Merging this pull request updates package metadata and consumes the fragments. It does not publish npm or create a GitHub Release. Publishing still requires an explicit matching \`v$RELEASE_VERSION\` tag, after which the existing trusted-publishing workflow verifies and publishes the prepared artifact."
            echo
            echo "## Generated validation"
            echo
            echo "The workflow reproduced the release output without installing project dependencies, matched it byte-for-byte with the read-only preparation artifact, and queued the normal design-system validation for the generated branch."
          } > "$body_file"

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$pr_number" ]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$RELEASE_BRANCH" \
                --title "🔧 chore(release): prepare $RELEASE_VERSION" \
                --body-file "$body_file"
            )"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "🔧 chore(release): prepare $RELEASE_VERSION" \
              --body-file "$body_file"
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: needs.prepare.outputs.has_changes == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_FRAGMENT_COUNT: ${{ needs.prepare.outputs.fragment_count }}
          RELEASE_PR_NUMBER: ${{ steps.pull_request.outputs.number }}
        run: |
          {
            echo "Prepared release $RELEASE_VERSION from $RELEASE_FRAGMENT_COUNT fragment(s)."
            echo
            echo "Pull request: #$RELEASE_PR_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs:
      - prepare
      - apply
    if: needs.prepare.outputs.has_changes == 'true' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch generated branch validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/zdp-design-system
        run: |
          gh workflow run design-system.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_BRANCH"
