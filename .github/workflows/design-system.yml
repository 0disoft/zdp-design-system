name: zdp-design-system

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.classify.outputs.static }}
      package: ${{ steps.classify.outputs.package }}
      storybook: ${{ steps.classify.outputs.storybook }}
      browser: ${{ steps.classify.outputs.browser }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          readonly zero_sha='0000000000000000000000000000000000000000'
          static=false
          package=false
          storybook=false
          browser=false
          run_all=false
          changed_files=()

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          if [[ -z "$head_sha" ]]; then
            echo '::error::Unable to resolve the head commit for change classification.'
            exit 1
          fi

          if [[ -z "$base_sha" || "$base_sha" == "$zero_sha" ]]; then
            run_all=true
          else
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "::error::Base commit ${base_sha} is unavailable after a full checkout."
              exit 1
            fi
            if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              echo "::error::Head commit ${head_sha} is unavailable after a full checkout."
              exit 1
            fi

            mapfile -t changed_files < <(
              git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$head_sha"
            )
          fi

          if [[ "$run_all" == 'true' ]]; then
            static=true
            package=true
            storybook=true
            browser=true
          else
            for path in "${changed_files[@]}"; do
              case "$path" in
                .github/workflows/*|.github/package-size-budget.json|package.json|bun.lock|bunfig.toml|tsconfig.json|svelte.config.js|vite.config.*)
                  static=true
                  package=true
                  storybook=true
                  browser=true
                  ;;
              esac

              case "$path" in
                src/*|tokens/*)
                  static=true
                  package=true
                  storybook=true
                  browser=true
                  ;;
              esac

              case "$path" in
                schemas/*|share.js|share.d.ts)
                  static=true
                  package=true
                  ;;
              esac

              case "$path" in
                .storybook/*|stories/*)
                  static=true
                  package=true
                  storybook=true
                  ;;
              esac

              case "$path" in
                preview/*)
                  static=true
                  ;;
              esac

              case "$path" in
                fixtures/*|.changes/*)
                  package=true
                  ;;
              esac

              case "$path" in
                tests/browser/*|tests/ssr/*|scripts/browser/*|scripts/check-browser-accessibility.mjs|scripts/check-ssr-hydration.mjs)
                  browser=true
                  ;;
              esac

              case "$path" in
                scripts/check-storybook*|scripts/browser/render-brand-mark.mjs)
                  storybook=true
                  ;;
              esac

              case "$path" in
                scripts/*)
                  static=true
                  package=true
                  ;;
              esac

              case "$path" in
                docs/*|README.md|CHANGELOG.md|LICENSE|SECURITY.md|THIRD_PARTY_NOTICES.md|RUNBOOK.md|service.yaml)
                  package=true
                  ;;
              esac
            done
          fi

          {
            printf 'static=%s\n' "$static"
            printf 'package=%s\n' "$package"
            printf 'storybook=%s\n' "$storybook"
            printf 'browser=%s\n' "$browser"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### CI path classification'
            echo
            echo '| Group | Selected |'
            echo '| --- | --- |'
            printf '| static | `%s` |\n' "$static"
            printf '| package | `%s` |\n' "$package"
            printf '| storybook | `%s` |\n' "$storybook"
            printf '| browser | `%s` |\n' "$browser"
            echo

            if [[ "$run_all" == 'true' ]]; then
              echo 'The event has no usable base SHA, so every validation group is selected.'
            elif (( ${#changed_files[@]} == 0 )); then
              echo 'No changed paths were reported.'
            else
              echo '<details><summary>Changed paths</summary>'
              echo
              printf -- '- `%s`\n' "${changed_files[@]}"
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  static:
    name: static contracts
    needs: changes
    if: ${{ needs.changes.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Verify Storybook Pages deployment contract
        run: node --test scripts/storybook-pages.test.mjs
      - name: Verify generated and source contracts
        run: |
          bun run tokens:check
          bun run consumer:check
          bun run share-icons:check
          bun run brand-assets:check
          bun run credit-assets:check
          bun run preview:check
          bun run type:check

  package:
    name: package contracts
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Verify distributable package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMPARE_API: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          bun run surface:check
          bun run release:changes:test
          bun run release:changes:check
          if [ "$COMPARE_API" = "true" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            bun scripts/check-public-api-contract.ts --base-ref "$BASE_SHA"
          else
            bun run api:check
          fi
          bun run package:build
          bun run package:check
          bun run publish:check
          bun run release:check
          bun run fixtures:check

      - name: Measure package size
        id: package_size
        continue-on-error: true
        run: |
          bun scripts/check-package-size.ts \
            --report reports/package-size.md \
            --json reports/package-size.json
      - name: Preserve package size report
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/package-size.md ]; then
            cat > reports/package-size.md <<'REPORT'
          <!-- zdp-package-size-report -->
          ## 📦 Package size report

          Measurement did not produce a report. Inspect the package job logs for the earlier failure.
          REPORT
          fi
          cat reports/package-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-size-report
          path: reports/package-size.*
          if-no-files-found: error
          retention-days: 7
      - name: Enforce package size budget
        if: always() && steps.package_size.outcome == 'failure'
        run: exit 1

  storybook:
    name: Storybook and runtime accessibility
    needs: changes
    if: ${{ needs.changes.outputs.storybook == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Verify Storybook contracts
        run: |
          bun run storybook:check
          bun run a11y:check
          bun run a11y:runtime:check
      - name: Build Storybook Pages artifact
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bun run storybook:build
      - name: Upload Storybook Pages artifact
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-pages
          path: storybook-static/
          if-no-files-found: error
          retention-days: 2

  browser:
    name: browser and hydration contracts
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Verify browser behavior
        run: |
          bun run ssr:hydration:check
          bun run browser:check

  check:
    name: check
    if: ${{ always() }}
    needs:
      - changes
      - static
      - package
      - storybook
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_SELECTED: ${{ needs.changes.outputs.static }}
          STATIC_RESULT: ${{ needs.static.result }}
          PACKAGE_SELECTED: ${{ needs.changes.outputs.package }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          STORYBOOK_SELECTED: ${{ needs.changes.outputs.storybook }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
          BROWSER_SELECTED: ${{ needs.changes.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail

          failed=false

          if [[ "$CHANGES_RESULT" != 'success' ]]; then
            echo "::error::Change classification finished with ${CHANGES_RESULT}."
            failed=true
          fi

          require_selected_success() {
            local name="$1"
            local selected="$2"
            local result="$3"

            printf '%-12s selected=%-5s result=%s\n' "$name" "${selected:-false}" "$result"

            if [[ "$selected" == 'true' && "$result" != 'success' ]]; then
              echo "::error::Selected ${name} validation finished with ${result}."
              failed=true
            elif [[ "$selected" != 'true' && "$result" != 'skipped' ]]; then
              echo "::error::Unselected ${name} validation unexpectedly finished with ${result}."
              failed=true
            fi
          }

          require_selected_success static "$STATIC_SELECTED" "$STATIC_RESULT"
          require_selected_success package "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          require_selected_success storybook "$STORYBOOK_SELECTED" "$STORYBOOK_RESULT"
          require_selected_success browser "$BROWSER_SELECTED" "$BROWSER_RESULT"

          if [[ "$failed" == 'true' ]]; then
            exit 1
          fi

  package-size-comment:
    if: ${{ always() && needs.changes.outputs.package == 'true' && needs.package.result != 'cancelled' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - changes
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download package size report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-size-report
          path: reports
      - name: Upsert pull request report
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- zdp-package-size-report -->'
          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
              | tail -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@reports/package-size.md
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@reports/package-size.md
          fi

