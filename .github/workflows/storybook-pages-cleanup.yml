name: Clean Storybook PR Preview

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted cleanup code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Configure ephemeral git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Remove Storybook preview
        id: cleanup
        run: |
          node scripts/storybook-pages.mjs cleanup \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Mark preview comment as removed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- zdp-storybook-preview -->'
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- zdp-storybook-preview -->"))) | .id' \
              | head -n 1
          )"

          if [ -z "$comment_id" ]; then
            exit 0
          fi

          body="$(cat <<EOF_BODY
          $marker
          ### Storybook preview

          Preview removed because this pull request is closed.
          EOF_BODY
          )"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
