name: Clean Storybook PR Preview

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr-number:
        description: Closed same-repository PR number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Confirm closed same-repository pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::A positive pull request number is required.'
            exit 1
          fi

          candidate="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" +            --jq 'select(.state == "closed") | .head.repo.full_name')"
          if [ "$candidate" != "$GITHUB_REPOSITORY" ]; then
            echo '::error::Only closed pull requests from this repository can be cleaned up.'
            exit 1
          fi

      - name: Check out trusted cleanup code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Configure ephemeral git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Remove Storybook preview
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          node scripts/storybook-pages.mjs cleanup \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER"

      - name: Mark preview comment as removed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          marker='<!-- zdp-storybook-preview -->'
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- zdp-storybook-preview -->"))) | .id' \
              | head -n 1
          )"

          if [ -z "$comment_id" ]; then
            exit 0
          fi

          body="$(cat <<EOF_BODY
          $marker
          ### Storybook preview

          Preview removed because this pull request is closed.
          EOF_BODY
          )"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
